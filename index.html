<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KWB - کێ فێڵبازە؟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        /* تاسک باڕی سەرەوە */
        .top-bar {
            height: 60px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #333;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .back-btn {
            font-size: 40px;
            color: #F87158;
            font-weight: 900;
            transform: scaleX(-1);
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-btn:active {
            opacity: 0.7;
        }
        
        .placeholder {
            width: 50px;
        }
        
        /* ناوەڕاست */
        .container {
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            overflow-y: auto;
            background: #000;
        }
        
        /* ناونیشان */
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #F87158;
            margin-bottom: 30px;
        }
        
        /* کۆنتەینەری کارتەکان */
        .cards-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
            border-radius: 30px;
            overflow: hidden;
        }
        
        /* کارتی ڕەش (لە ژێرەوە) */
        .black-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            border: 3px solid #F87158;
            border-radius: 30px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        .category {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 15px;
        }
        
        .value {
            font-size: 36px;
            font-weight: 800;
            color: #F87158;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .spy-img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 15px;
            border: 2px solid #F87158;
            display: none;
            margin-top: 10px;
        }
        
        /* کارتی پرتەقاڵی (لە سەرەوە) */
        .orange-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F87158;
            border-radius: 30px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.1s linear;
            cursor: grab;
            box-shadow: 0 8px 0 #B85C3A;
        }
        
        .player-name {
            font-size: 32px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .action-text {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .swipe {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            margin-top: 10px;
        }
        
        .arrow {
            font-size: 30px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-10px)}
        }
        
        /* بەشی خوارەوە */
        .bottom-section {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .lock-btn {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #333;
            border: 2px solid #F87158;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #B85C3A;
        }
        
        .lock-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        
        .lock-btn.locked {
            background: #F87158;
        }
        
        .next-btn {
            flex: 1;
            height: 60px;
            background: #4CAF50;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #2d6a2d;
        }
        
        .next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2d6a2d;
        }
        
        .next-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
            background: #666;
            box-shadow: 0 6px 0 #444;
        }
        
        /* دیالۆگ */
        .dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .dialog-content {
            background: #222;
            padding: 30px;
            border-radius: 30px;
            border: 2px solid #F87158;
            max-width: 350px;
            width: 100%;
            text-align: center;
        }
        
        .dialog h3 {
            color: #F87158;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .dialog p {
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .dialog-buttons {
            display: flex;
            gap: 15px;
        }
        
        .dialog-btn {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }
        
        .yes {
            background: #F44336;
            color: white;
            box-shadow: 0 5px 0 #B33A30;
        }
        
        .no {
            background: #4CAF50;
            color: white;
            box-shadow: 0 5px 0 #2d6a2d;
        }
        
        .yes:active, .no:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        
        /* پەڕەی کۆتایی */
        .final-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        
        .final-content {
            text-align: center;
        }
        
        .final-title {
            font-size: 48px;
            color: #F87158;
            font-weight: 800;
            margin-bottom: 20px;
        }
        
        .final-message {
            font-size: 28px;
            color: #aaa;
            margin-bottom: 40px;
        }
        
        .dots {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .dot {
            width: 20px;
            height: 20px;
            background: #F87158;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes pulse {
            0%,100%{transform:scale(0.8);opacity:0.5}
            50%{transform:scale(1.2);opacity:1}
        }
    </style>
</head>
<body>

    <!-- ========== تاسک باڕی سەرەوە ========== -->
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()">←</div>
        <div class="placeholder"></div>
    </div>

    <!-- ========== ناوەڕاست ========== -->
    <div class="container" id="mainContainer">
        
        <!-- ناونیشان -->
        <div class="title">کێ فێڵبازە؟</div>
        
        <!-- کۆنتەینەری کارتەکان -->
        <div class="cards-wrapper" id="cardsWrapper">
            
            <!-- کارتی ڕەش (لە ژێرەوە) -->
            <div class="black-card" id="blackCard">
                <div class="category" id="cardCategory">کەتەگۆری</div>
                <div class="value" id="cardValue">کوردستان</div>
                <img class="spy-img" id="spyImage" src="https://i.ibb.co/Fbmy9N21/Screenshot-20260222-213229-Gallery.jpg" alt="فێڵباز">
            </div>

            <!-- کارتی پرتەقاڵی (لە سەرەوە) -->
            <div class="orange-card" id="orangeCard">
                <div class="player-name" id="playerName">یاریزان</div>
                <div class="action-text" id="actionText">پێویستە کارتەکەت ببینیت</div>
                <div class="swipe" id="swipeIndicator">
                    <span class="arrow">⬆️</span>
                    <span>بەرەو سەرەوە بخە</span>
                </div>
            </div>
        </div>

        <!-- بەشی خوارەوە -->
        <div class="bottom-section">
            <div class="lock-btn" id="lockBtn" onclick="showLockDialog()">🔓</div>
            <button class="next-btn disabled" id="nextBtn" onclick="nextPlayer()">سەرەتا کارتەکەت ببینە</button>
        </div>
    </div>

    <!-- ===== پەڕەی کۆتایی ===== -->
    <div class="final-page" id="finalPage" style="display: none;">
        <div class="final-content">
            <div class="final-title">کێ فێڵبازە؟</div>
            <div class="final-message">بەم زوانە چالاک دەبێت</div>
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <!-- ===== دیالۆگی دڵنیابوون ===== -->
    <div class="dialog" id="lockDialog">
        <div class="dialog-content">
            <h3>🔒 دڵنیابوون</h3>
            <p>دڵنیای دەتەوێت کارتەکەت دابخەی؟</p>
            <div class="dialog-buttons">
                <button class="dialog-btn yes" onclick="confirmLock(true)">بەڵێ</button>
                <button class="dialog-btn no" onclick="confirmLock(false)">نەخێر</button>
            </div>
        </div>
    </div>

    <script>
        // ========== کۆدی سەرەکی ==========
        let players = ['ئارام', 'دیاری', 'ژین', 'ڕۆژان', 'سارا'];
        let currentIndex = 0;
        let hasSeen = false;
        let isLocked = false;
        let touchStartY = 0;
        let isDragging = false;
        
        // بەدەستهێنانی ئێلمانەکان
        const orangeCard = document.getElementById('orangeCard');
        const playerName = document.getElementById('playerName');
        const actionText = document.getElementById('actionText');
        const swipeIndicator = document.getElementById('swipeIndicator');
        const cardValue = document.getElementById('cardValue');
        const cardCategory = document.getElementById('cardCategory');
        const spyImage = document.getElementById('spyImage');
        const nextBtn = document.getElementById('nextBtn');
        const lockBtn = document.getElementById('lockBtn');
        const lockDialog = document.getElementById('lockDialog');
        const finalPage = document.getElementById('finalPage');
        const mainContainer = document.getElementById('mainContainer');
        
        // دەستپێکردن
        updateDisplay();
        
        // نوێکردنەوەی پیشاندان
        function updateDisplay() {
            if (currentIndex >= players.length) {
                // چوون بۆ پەڕەی کۆتایی
                mainContainer.style.display = 'none';
                finalPage.style.display = 'flex';
                return;
            }
            
            playerName.textContent = players[currentIndex];
            actionText.textContent = 'پێویستە کارتەکەت ببینیت';
            swipeIndicator.style.display = 'flex';
            hasSeen = false;
            
            // دیاریکردنی کارت
            if (currentIndex === 1) { // یاریزانی دووەم (فێڵباز)
                cardValue.textContent = 'تۆ فێڵبازی';
                cardCategory.textContent = 'ئاگاداری';
                spyImage.style.display = 'block';
            } else {
                cardValue.textContent = 'کوردستان';
                cardCategory.textContent = 'شوێن';
                spyImage.style.display = 'none';
            }
            
            updateNextButton();
            orangeCard.style.transform = 'translateY(0)';
        }
        
        // نوێکردنەوەی دوگمە
        function updateNextButton() {
            if (!hasSeen) {
                nextBtn.textContent = 'سەرەتا کارتەکەت ببینە';
                nextBtn.classList.add('disabled');
            } else {
                if (currentIndex === players.length - 1) {
                    nextBtn.textContent = 'دەستپێبکە';
                } else {
                    nextBtn.textContent = `بیدە بە ${players[currentIndex + 1]}`;
                }
                nextBtn.classList.remove('disabled');
            }
        }
        
        // ===== جوڵەی پەنجە =====
        orangeCard.addEventListener('touchstart', (e) => {
            if (isLocked) return;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
        });
        
        orangeCard.addEventListener('touchmove', (e) => {
            if (!isDragging || isLocked) return;
            e.preventDefault();
            
            const touchY = e.touches[0].clientY;
            const diff = touchStartY - touchY;
            
            if (diff > 0) {
                const move = Math.min(diff, 350); // 100%
                orangeCard.style.transform = `translateY(-${move}px)`;
            }
        });
        
        orangeCard.addEventListener('touchend', () => {
            if (!isDragging || isLocked) return;
            
            const transform = orangeCard.style.transform;
            const match = transform.match(/translateY\(-(\d+)px\)/);
            const moveY = match ? parseInt(match[1]) : 0;
            
            if (moveY > 100 && !hasSeen) {
                hasSeen = true;
                actionText.textContent = 'کارتەکەت بینی';
                swipeIndicator.style.display = 'none';
                updateNextButton();
            }
            
            orangeCard.style.transform = 'translateY(0)';
            isDragging = false;
        });
        
        // ===== دوگمەی قفڵ =====
        function showLockDialog() {
            if (!hasSeen) {
                alert('سەرەتا کارتەکەت ببینە');
                return;
            }
            lockDialog.style.display = 'flex';
        }
        
        function confirmLock(confirmed) {
            lockDialog.style.display = 'none';
            if (confirmed) {
                isLocked = true;
                lockBtn.innerHTML = '🔒';
                lockBtn.classList.add('locked');
            }
        }
        
        // ===== دوگمەی دواتر =====
        function nextPlayer() {
            if (!hasSeen) return;
            
            if (currentIndex < players.length - 1) {
                currentIndex++;
                isLocked = false;
                lockBtn.innerHTML = '🔓';
                lockBtn.classList.remove('locked');
                updateDisplay();
            } else {
                // کۆتا یاریزان - دەستپێکردن
                mainContainer.style.display = 'none';
                finalPage.style.display = 'flex';
            }
        }
        
        // ===== گەڕانەوە =====
        function goBack() {
            alert('گەڕانەوە بۆ پەڕەی سەرەکی');
        }
    </script>
</body>
</html>
